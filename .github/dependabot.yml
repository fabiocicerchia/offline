version: 2
updates:
  # Keep GitHub Actions pinned versions fresh.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Wait 7 days before proposing newly published versions — a freshly
    # released (or repointed) package can be malicious/unstable.
    cooldown:
      default-days: 7
    groups:
      # Everything else rides in one pull request rather than one each.
      actions:
        patterns: ["*"]

  # go.mod dependencies (seccomp-golang, x/sys).
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
