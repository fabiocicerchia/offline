name: code-quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # Lint the GitHub Actions workflows themselves.
      - name: actionlint
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7  # v2.2.0

      # Enforce .editorconfig (indentation, EOL, trailing whitespace).
      - name: editorconfig-checker
        uses: editorconfig-checker/action-editorconfig-checker@d2ed4fd072ae6f887e9407c909af0f585d2ad9f4  # v2

      # Catch common typos in code and docs.
      - name: typos
        uses: crate-ci/typos@5e38bf262baaf477ca9f241b3a7cd3d277fd7df8 # master

      # libseccomp-dev is needed for the cgo binding the local gofmt/go-vet
      # pre-commit hooks compile against.
      - name: install libseccomp headers
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libseccomp-dev

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: "1.25"

      # pre-commit runs the language-specific hooks defined in
      # .pre-commit-config.yaml (gofmt, go vet, gitleaks, ...).
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.x"
      - name: pre-commit
        uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd  # v3.0.1

      - name: go test
        run: go test ./...
