# Backstage catalog entry, read by paved's scorecard plugin.
#
# Every check paved scores is derived from this file alone — no cluster
# access, no CI credentials. What is absent here is absent from the score.
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: offline
  description: >-
      offline is a Linux sandbox wrapper that executes another program with its network access completely
      isolated.
  annotations:
    github.com/project-slug: fabiocicerchia/offline
    backstage.io/source-location: url:https://github.com/fabiocicerchia/offline/
    backstage.io/techdocs-ref: dir:.
  links:
    - url: https://github.com/fabiocicerchia/offline
      title: Source
spec:
  type: library
  lifecycle: production
  owner: group:default/kodebeat
  system: oss-tools
